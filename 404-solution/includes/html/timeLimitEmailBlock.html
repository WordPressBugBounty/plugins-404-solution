<!-- allow-hardcoded-color: email clients ignore CSS custom properties, so inline hex is required -->
<div style="margin:24px 0 0 0;padding:16px 0 0 0;border-top:1px solid #dcdcde;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;color:#1e1e1e;">
<p style="margin:0 0 8px 0;font-weight:600;">{heading}</p>
<p style="margin:0 0 12px 0;">{summary}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:100%;max-width:640px;">
<tr><th align="left" style="padding:4px 8px 4px 0;font-size:12px;color:#50575e;font-weight:600;">{componentHeading}</th><th align="right" style="padding:4px 8px;font-size:12px;color:#50575e;font-weight:600;">{secondsHeading}</th><th align="left" style="padding:4px 0;font-size:12px;color:#50575e;font-weight:600;width:45%;">&nbsp;</th></tr>
{rows}
</table>
<p style="margin:12px 0 0 0;font-size:13px;color:#50575e;">{details}</p>
<p style="margin:8px 0 0 0;font-size:12px;color:#50575e;">{method}</p>
</div>
